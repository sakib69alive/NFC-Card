        {
          id: "steam",
          title: "Steam",
          subtitle: "Add as Friend",

    document.addEventListener("DOMContentLoaded", () => {
      document.title = `${CONFIG.fullName} | Digital Card`;
      document.getElementById('user-fullname').textContent = CONFIG.fullName;
      document.getElementById('user-profession').textContent = CONFIG.profession;
      
      const companyEl = document.getElementById('user-company');
      const companyLink = document.getElementById('company-link');
      const metaBullet = document.getElementById('meta-bullet');
      
      if (CONFIG.company) {
        companyEl.textContent = CONFIG.company;
        companyLink.classList.remove('hidden');
        if (CONFIG.companyWebsite) companyLink.href = CONFIG.companyWebsite;
      }

      const locationEl = document.getElementById('user-location');
      const locationBox = document.getElementById('location-box');
      if (CONFIG.location) {
        locationEl.textContent = CONFIG.location;
        if (CONFIG.company) metaBullet.classList.remove('hidden');
      } else {
        locationBox.classList.add('hidden');
      }

      document.getElementById('user-bio').textContent = CONFIG.bio;
      
      // অটো-ডিটেক্ট ইমেজ লোডার: কোনো থার্ড-পার্টি ইমেজের ব্যাকআপ তুলে দিয়ে ক্লিন নিউট্রাল আইকন রাখা হয়েছে
      const possibleAvatars = [
        CONFIG.avatarUrl,
        'profile.jpg',
        'profile.png',
        'profile.jpeg',
        '39_26 AM_2.png',
        '39_26 AM.png'
      ];
      let avatarIndex = 0;

      const avatarEl = document.getElementById('profile-avatar');
      const defaultSvgFallback = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' fill='%238C8475' viewBox='0 0 24 24'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>";

      avatarEl.onerror = function() {
        avatarIndex++;
        if (avatarIndex < possibleAvatars.length) {
          this.src = possibleAvatars[avatarIndex];
        } else {
          this.src = defaultSvgFallback;
        }
      };
      avatarEl.src = possibleAvatars[0];

      document.getElementById('cover-img').src = CONFIG.coverUrl;

      document.getElementById('btn-call').href = `tel:${CONFIG.phone}`;
      document.getElementById('btn-whatsapp').href = `https://wa.me/${CONFIG.whatsapp}`;
      document.getElementById('btn-email').href = `mailto:${CONFIG.email}`;

      const linksContainer = document.getElementById('links-container');
      linksContainer.innerHTML = '';

      CONFIG.links.forEach(link => {
        if (!link.url && !link.copyValue) return;

        const card = document.createElement('a');
        card.href = link.url || '#';
        if (link.url && link.url.startsWith('http')) {
          card.target = "_blank";
          card.rel = "noopener noreferrer";
        }
        
        if (link.action === "copy") {
          card.onclick = (e) => {
            e.preventDefault();
            fallbackCopyText(link.copyValue);
            showToast(`${link.title} tag copied!`);
          };
        }

        card.className = "flex items-center justify-between p-3 rounded-xl bg-white border border-stone-200/90 hover:border-bronze-500/40 hover:bg-stone-50/80 active:scale-[0.99] transition-all group shadow-subtle cursor-pointer";
        
        card.innerHTML = `
          <div class="flex items-center space-x-3">
            <div class="p-2 rounded-lg bg-stone-100 group-hover:bg-bronze-100/60 transition-colors">
              ${link.icon}
            </div>
            <div>
              <div class="text-xs font-semibold text-stone-800 group-hover:text-stone-950 transition-colors">${link.title}</div>
              <div class="text-[10px] text-stone-500">${link.subtitle}</div>
            </div>
          </div>
          <svg class="w-4 h-4 text-stone-400 group-hover:text-bronze-600 group-hover:translate-x-0.5 transition-all" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 5l7 7-7 7"/></svg>
        `;
        
        linksContainer.appendChild(card);
      });

      const qrcodeContainer = document.getElementById("qrcode-canvas");
      qrcodeContainer.innerHTML = '';
      if (window.QRCode) {
        new QRCode(qrcodeContainer, {
          text: window.location.href,
          width: 150,
          height: 150,
          colorDark: "#1C1A17",
          colorLight: "#FFFFFF",
          correctLevel: QRCode.CorrectLevel.H
        });
      }
    });

    function downloadVCard() {
      const vcardData = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        `FN;CHARSET=UTF-8:${CONFIG.fullName}`,
        `N;CHARSET=UTF-8:${CONFIG.fullName.split(' ').pop()};${CONFIG.fullName.split(' ')[0]};;;`,
        CONFIG.company ? `ORG;CHARSET=UTF-8:${CONFIG.company}` : '',
        `TITLE;CHARSET=UTF-8:${CONFIG.profession}`,
        `TEL;TYPE=CELL,VOICE:${CONFIG.phone}`,
        `EMAIL;TYPE=WORK,INTERNET:${CONFIG.email}`,
        `NOTE;CHARSET=UTF-8:${CONFIG.vcard.note}`,
        'END:VCARD'
      ].filter(Boolean).join('\n');

      const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8;' });
      const url = window.URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.setAttribute('download', `${CONFIG.fullName.replace(/\s+/g, '_')}.vcf`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      window.URL.revokeObjectURL(url);

      showToast("Contact card downloaded");
    }

    function copyProfileUrl() {
      const currentUrl = window.location.href;
      
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(currentUrl).then(() => {
          showToast("Profile URL copied");
        }).catch(() => {
          fallbackCopyText(currentUrl);
        });
      } else {
        fallbackCopyText(currentUrl);
      }
    }

    function fallbackCopyText(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      
      try {
        document.execCommand('copy');
        showToast("Profile URL copied");
      } catch (err) {
        showToast("Unable to copy URL");
      }
      document.body.removeChild(textarea);
    }

    function nativeShare() {
      if (navigator.share) {
        navigator.share({
          title: `${CONFIG.fullName} | Digital Profile`,
          text: `Contact profile for ${CONFIG.fullName}`,
          url: window.location.href
        }).catch(() => {});
      } else {
        copyProfileUrl();
      }
    }

    function openQrModal() {
      const modal = document.getElementById('qr-modal');
      const content = document.getElementById('qr-modal-content');
      modal.classList.remove('pointer-events-none', 'opacity-0');
      modal.classList.add('opacity-100');
      content.classList.remove('scale-95');
      content.classList.add('scale-100');
    }

    function closeQrModal() {
      const modal = document.getElementById('qr-modal');
      const content = document.getElementById('qr-modal-content');
      modal.classList.add('pointer-events-none', 'opacity-0');
      modal.classList.remove('opacity-100');
      content.classList.add('scale-95');
      content.classList.remove('scale-100');
    }

    function openShareModal() {
      const modal = document.getElementById('share-modal');
      const content = document.getElementById('share-modal-content');
      modal.classList.remove('pointer-events-none', 'opacity-0');
      modal.classList.add('opacity-100');
      content.classList.remove('translate-y-full');
      content.classList.add('translate-y-0');
    }

    function closeShareModal() {
      const modal = document.getElementById('share-modal');
      const content = document.getElementById('share-modal-content');
      modal.classList.add('pointer-events-none', 'opacity-0');
      modal.classList.remove('opacity-100');
      content.classList.add('translate-y-full');
      content.classList.remove('translate-y-0');
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-message');
      toastMsg.textContent = message;
      
      toast.classList.remove('-translate-y-20', 'opacity-0', 'pointer-events-none');
      toast.classList.add('translate-y-0', 'opacity-100');
      
      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('-translate-y-20', 'opacity-0', 'pointer-events-none');
      }, 2600);
    }
  </script>
