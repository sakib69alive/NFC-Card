<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F2EA" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Digital Business Card</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
          },
          colors: {
            stone: {
              50: '#FAF9F6',
              100: '#F3F1EC',
              200: '#E8E5DE',
              300: '#D6D1C7',
              400: '#B5AEA0',
              500: '#8C8475',
              600: '#6B6355',
              700: '#524C41',
              800: '#38342D',
              900: '#1C1A17',
            },
            bronze: {
              50: '#FBF8F3',
              100: '#F5EFE4',
              200: '#E7D8C2',
              300: '#D5BC9A',
              400: '#B8976C',
              500: '#8C7355',
              600: '#735E44',
              700: '#594834',
              800: '#403324',
              900: '#261E15',
            }
          },
          boxShadow: {
            'card': '0 20px 40px -15px rgba(28, 26, 23, 0.07)',
            'float': '0 12px 28px -8px rgba(28, 26, 23, 0.12)',
            'subtle': '0 2px 10px rgba(0, 0, 0, 0.03)',
          }
        }
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root{--bg:#F6F2EA;--ivory:#1E1B16;--soft:#4A4439;--mute:#6F675A;--dim:#9A917F;--line:rgba(30,27,22,.10);--brass:#8A6A42;--ink:#F6F2EA;--ease:cubic-bezier(.22,1,.36,1)}
    *{-webkit-tap-highlight-color:transparent}
    html{background:var(--bg);color-scheme:light}
    body{margin:0;min-height:100vh;min-height:100dvh;color:var(--ivory);overflow-x:hidden;-webkit-font-smoothing:antialiased;
      background:radial-gradient(120% 55% at 50% -6%,#FFFFFF,transparent 65%),radial-gradient(90% 45% at 100% 75%,rgba(200,167,123,.14),transparent 70%),var(--bg)}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E")}
    .selectable{user-select:text;-webkit-user-select:text}
    a,button{touch-action:manipulation}
    a:focus-visible,button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

    .card{position:relative;z-index:1;width:100%;max-width:440px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
      padding:calc(env(safe-area-inset-top,0px) + 14px) max(22px,env(safe-area-inset-right,0px)) 0 max(22px,env(safe-area-inset-left,0px))}
    .backdrop{position:absolute;top:0;left:0;right:0;height:min(58vh,430px);z-index:-1;overflow:hidden;pointer-events:none;
      -webkit-mask-image:linear-gradient(#000 30%,transparent 100%);mask-image:linear-gradient(#000 30%,transparent 100%)}
    .backdrop img{width:100%;height:100%;object-fit:cover;object-position:center;opacity:.30;filter:grayscale(1) sepia(.25) brightness(1.05) contrast(.95);animation:fade .8s ease both}

    .top{display:flex;justify-content:space-between;align-items:center}
    .chip,.round{height:42px;display:inline-flex;align-items:center;justify-content:center;color:var(--ivory);background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:14px;transition:transform .12s var(--ease),background .2s}
    .chip{gap:8px;padding:0 15px 0 12px;font-size:13px;font-weight:500}
    .round{width:42px}
    .chip .ic{color:var(--brass)}
    .chip:active,.round:active{transform:scale(.95);background:rgba(30,27,22,.12)}
    .ic{width:18px;height:18px;flex:none}

    .avatar{position:relative;width:128px;height:128px;margin-top:52px;padding:4px;border-radius:34px;background:var(--bg);
      box-shadow:0 0 0 1px rgba(200,167,123,.55),0 26px 40px -18px rgba(70,50,25,.30)}
    .avatar img{width:100%;height:100%;object-fit:cover;display:block;border-radius:30px;background:#E9E3D6}
    .live{position:absolute;right:5px;bottom:5px;width:15px;height:15px;border-radius:50%;background:#2f9e6b;border:3px solid var(--bg)}
    .idrow{display:flex;align-items:center;gap:10px;margin-top:24px}
    .name{margin:0;min-width:0;font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:clamp(38px,11.6vw,52px);line-height:1;letter-spacing:-.02em;color:var(--ivory);text-wrap:balance}
    .vbadge{flex:none;color:var(--brass);display:inline-flex}
    .vbadge svg{width:20px;height:20px}
    .role{margin:12px 0 0;font-size:14px;font-weight:500;letter-spacing:.02em;color:var(--brass)}
    .meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:10px;font-size:13px;color:var(--mute)}
    .meta a{display:inline-flex;align-items:center;gap:6px;color:var(--mute)}
    .meta svg{width:14px;height:14px;color:var(--dim);flex:none}
    .meta>div,.meta>a{gap:6px}
    #meta-bullet{color:var(--dim)}
    .bio{margin:18px 0 0;font-size:15px;line-height:1.65;color:var(--soft)}

    .actions{margin-top:26px;display:grid;gap:12px}
    .cta{height:54px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:16px;background:var(--ivory);color:var(--ink);font:600 15px/1 "Plus Jakarta Sans",sans-serif;letter-spacing:.01em;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 14px 26px -12px rgba(30,27,22,.45);transition:transform .12s var(--ease),filter .2s}
    .cta .ic{width:20px;height:20px;color:#D9BD94}
    .cta:active{transform:scale(.985);filter:brightness(.93)}
    .surface{background:linear-gradient(180deg,#FFFFFF,rgba(255,255,255,.72));border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 18px 30px -22px rgba(70,50,25,.22)}
    .quick{display:grid;grid-template-columns:repeat(3,1fr)}
    .quick a{display:flex;flex-direction:column;align-items:center;gap:8px;padding:17px 4px 15px;font-size:12.5px;font-weight:500;color:var(--ivory);transition:background .2s,transform .12s var(--ease)}
    .quick a+a{border-left:1px solid var(--line)}
    .quick .ic{width:22px;height:22px}
    .quick a:active{background:rgba(30,27,22,.08)}
    .quick a:active .ic{transform:scale(.92)}
    .quick .ic{transition:transform .12s var(--ease)}

    .links{margin-top:28px}
    .label{margin:0 4px 10px;font-size:13px;font-weight:500;letter-spacing:.02em;color:var(--mute)}
    .link-row{display:flex;align-items:center;gap:14px;min-height:64px;padding:12px 16px;color:var(--ivory);cursor:pointer;transition:background .2s}
    .link-row+.link-row{border-top:1px solid var(--line)}
    .link-row:active{background:rgba(30,27,22,.08)}
    .link-row .ico{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:12px;background:rgba(30,27,22,.06);border:1px solid var(--line)}
    .link-row .ico svg{width:20px;height:20px;color:var(--ivory)}
    .link-row .txt{flex:1;min-width:0}
    .link-row b{display:block;font-size:15px;font-weight:600;line-height:1.25}
    .link-row small{display:block;margin-top:2px;font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .link-row .chev{width:16px;height:16px;flex:none;color:var(--dim);transition:transform .15s var(--ease),color .2s}
    .link-row:active .chev{transform:translateX(3px);color:var(--brass)}

    .foot{margin-top:auto;padding:34px 0 calc(env(safe-area-inset-bottom,0px) + 24px);display:flex;justify-content:center;align-items:center;gap:8px;font-size:12px;letter-spacing:.04em;color:var(--dim)}
    .foot i{width:5px;height:5px;border-radius:50%;background:var(--brass)}

    .rv{animation:rv .42s var(--ease) both;animation-delay:calc(var(--i,0)*55ms + 60ms)}
    @keyframes rv{from{opacity:0;transform:translateY(10px)}}
    @keyframes fade{from{opacity:0}}

    #toast{top:calc(env(safe-area-inset-top,0px) + 12px)}
    #toast>div{background:#1E1B16;border-color:rgba(200,167,123,.35)}
    #qr-modal,#share-modal{background:rgba(40,32,22,.45)}
    #qr-modal-content,#share-modal-content{background:#FCFAF5;border-color:var(--line)}
    #share-modal-content{padding-bottom:calc(1.5rem + env(safe-area-inset-bottom,0px))}
    .modal-card .text-stone-900,.modal-card .text-stone-800,.modal-card .text-stone-700{color:var(--ivory)}
    .modal-card .text-stone-500,.modal-card .text-stone-400{color:var(--mute)}
    .modal-card .bg-stone-100,.modal-card .bg-stone-300{background:rgba(30,27,22,.08)}
    .modal-card button{background:rgba(30,27,22,.06);border-color:var(--line);color:var(--ivory)}
    .modal-card button:hover,.modal-card button:active{background:rgba(30,27,22,.12)}
    .modal-backdrop{transition:opacity .25s cubic-bezier(.16,1,.3,1)}
    .modal-card{transition:transform .25s cubic-bezier(.16,1,.3,1),opacity .25s cubic-bezier(.16,1,.3,1)}

    @media (max-height:700px){.avatar{width:108px;height:108px;margin-top:34px;border-radius:30px}.avatar img{border-radius:26px}.idrow{margin-top:18px}.bio{margin-top:14px}.actions{margin-top:20px}}
    @media (max-width:340px){.card{padding-left:18px;padding-right:18px}.bio{font-size:14px}}
    @media (prefers-reduced-motion:reduce){.rv,.backdrop img{animation:none}*{transition-duration:.01ms!important}}
  </style>
</head>

<body>
  <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 transform -translate-y-20 opacity-0 transition-all duration-300 pointer-events-none w-[90%] max-w-xs">
    <div class="bg-[#1C1A17] text-[#FAF9F6] text-xs font-medium px-4 py-3 rounded-full shadow-float border border-stone-800 flex items-center justify-center space-x-2.5 text-center">
      <span class="w-1.5 h-1.5 rounded-full bg-bronze-400"></span>
      <span id="toast-message">Action completed</span>
    </div>
  </div>

  <main class="card">
    <div class="backdrop" aria-hidden="true"><img id="cover-img" src="" alt="" /></div>

    <header class="top rv" style="--i:0">
      <button class="chip" onclick="openQrModal()"><svg class="ic" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"/></svg><span>QR Code</span></button>
      <button class="round" onclick="openShareModal()" aria-label="Share Profile"><svg class="ic" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg></button>
    </header>

    <section>
      <div class="avatar rv" style="--i:1">
        <img id="profile-avatar" src="" alt="Sakib Al Hasan"  onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' fill=\'%238C8475\' viewBox=\'0 0 24 24\'><path d=\'M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z\'/></svg>';" />
        <i class="live" title="Available"></i>
      </div>
      <div class="idrow rv" style="--i:2">
        <h1 id="user-fullname" class="name selectable"></h1>
        <span class="vbadge" title="Verified Profile"><svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M6.267 3.455a3.066 3.066 0 001.745-.723 3.066 3.066 0 013.976 0 3.066 3.066 0 001.745.723 3.066 3.066 0 012.812 2.812c.051.643.304 1.254.723 1.745a3.066 3.066 0 010 3.976 3.066 3.066 0 00-.723 1.745 3.066 3.066 0 01-2.812 2.812 3.066 3.066 0 00-1.745.723 3.066 3.066 0 01-3.976 0 3.066 3.066 0 00-1.745-.723 3.066 3.066 0 01-2.812-2.812 3.066 3.066 0 00-.723-1.745 3.066 3.066 0 010-3.976 3.066 3.066 0 00.723-1.745 3.066 3.066 0 012.812-2.812zm7.44 5.252a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg></span>
      </div>
      <p id="user-profession" class="role selectable rv" style="--i:3"></p>
      <div id="meta-info-container" class="meta rv" style="--i:3">
        <a id="company-link" href="#" target="_blank" rel="noopener" class="hidden"><svg class="" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg><span id="user-company" class="selectable"></span></a>
        <span id="meta-bullet" class="hidden">•</span>
        <div id="location-box" class="inline-flex items-center"><svg class="" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg><span id="user-location" class="selectable"></span></div>
      </div>
      <p id="user-bio" class="bio selectable rv" style="--i:4"></p>
    </section>

    <section class="actions rv" style="--i:5">
      <button class="cta" onclick="downloadVCard()"><svg class="ic" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg><span>Save to Contacts</span></button>
      <div class="quick surface">
        <a id="btn-call" href="#"><svg class="ic" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg><span>Call</span></a>
        <a id="btn-whatsapp" href="#" target="_blank" rel="noopener"><svg class="ic" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg><span>WhatsApp</span></a>
        <a id="btn-email" href="#"><svg class="ic" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg><span>Email</span></a>
      </div>
    </section>

    <section class="links rv" style="--i:6">
      <h2 class="label">Connect &amp; Portfolios</h2>
      <div class="surface" id="links-container"></div>
    </section>

    <footer class="foot"><i></i><span>NFC Digital Profile</span></footer>
  </main>

  <div id="qr-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-stone-900/60 opacity-0 pointer-events-none modal-backdrop p-4">
    <div class="bg-[#FAF9F6] border border-stone-200 rounded-2xl p-6 w-full max-w-xs text-center shadow-float relative transform scale-95 modal-card" id="qr-modal-content">
      <button onclick="closeQrModal()" class="absolute top-4 right-4 text-stone-400 hover:text-stone-800 p-1 rounded-full hover:bg-stone-100 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
      
      <h3 class="text-base font-serif font-medium text-stone-900 mb-0.5">Scan to Connect</h3>
      <p class="text-[11px] text-stone-500 mb-5">Point device camera to view profile</p>
      
      <div class="bg-white p-3.5 rounded-xl inline-block border border-stone-200/80 shadow-subtle mb-4">
        <div id="qrcode-canvas" class="flex justify-center items-center"></div>
      </div>

      <button onclick="closeQrModal()" class="w-full py-2.5 bg-stone-100 hover:bg-stone-200 text-xs font-semibold uppercase tracking-wider text-stone-800 rounded-xl transition-colors">
        Close
      </button>
    </div>
  </div>

  <div id="share-modal" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-stone-900/60 opacity-0 pointer-events-none modal-backdrop p-0 sm:p-4">
    <div class="bg-[#FAF9F6] border-t sm:border border-stone-200 rounded-t-3xl sm:rounded-2xl p-6 w-full max-w-md shadow-float relative transform translate-y-full sm:translate-y-0 modal-card" id="share-modal-content">
      <div class="w-10 h-1 bg-stone-300 rounded-full mx-auto mb-4 sm:hidden"></div>
      <button onclick="closeShareModal()" class="hidden sm:block absolute top-4 right-4 text-stone-400 hover:text-stone-800 p-1 rounded-full hover:bg-stone-100 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>

      <h3 class="text-base font-serif font-medium text-stone-900 mb-0.5">Share Profile</h3>
      <p class="text-[11px] text-stone-500 mb-4">Select sharing method</p>

      <div class="space-y-2">
        <button onclick="copyProfileUrl(); closeShareModal();" class="w-full p-3 bg-white border border-stone-200 hover:bg-stone-50 rounded-xl flex items-center space-x-3 text-xs text-stone-800 transition-colors text-left shadow-subtle">
          <div class="p-2 rounded-lg bg-stone-100 text-stone-700">

          icon: `<svg class="w-4 h-4 text-stone-700" fill="currentColor" viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>`
        },
        {

          url: "steam://friends/add/765611997316413067",
          icon: `<svg class="w-4 h-4 text-stone-700" fill="currentColor" viewBox="0 0 24 24"><path d="M11.979 0C5.678 0 .511 4.86.022 11.037l6.432 2.658c.545-.371 1.203-.59 1.912-.59.063 0 .125.004.188.006l2.861-4.142V8.91c0-2.495 2.028-4.524 4.524-4.524 2.494 0 4.524 2.03 4.524 4.524s-2.03 4.524-4.524 4.524c-.104 0-.206-.007-.31-.014l-4.082 2.912c.005.084.01.168.01.253 0 1.856-1.505 3.361-3.362 3.361-1.637 0-3.003-1.17-3.302-2.723L.283 15.31C1.611 20.354 6.368 24 11.979 24c6.627 0 12-5.373 12-12s-5.373-12-12-12z"/></svg>`

      ],

      vcard: {
        note: "Met via Digital Business Card",
        version: "3.0"
      }
    };

    document.addEventListener("DOMContentLoaded", () => {
      document.title = `${CONFIG.fullName} | Digital Card`;
      document.getElementById('user-fullname').textContent = CONFIG.fullName;
      document.getElementById('user-profession').textContent = CONFIG.profession;
      
      const companyEl = document.getElementById('user-company');
      const companyLink = document.getElementById('company-link');
      const metaBullet = document.getElementById('meta-bullet');
      
      if (CONFIG.company) {
        companyEl.textContent = CONFIG.company;
        companyLink.classList.remove('hidden');
        if (CONFIG.companyWebsite) companyLink.href = CONFIG.companyWebsite;
      }

      const locationEl = document.getElementById('user-location');
      const locationBox = document.getElementById('location-box');
      if (CONFIG.location) {
        locationEl.textContent = CONFIG.location;
        if (CONFIG.company) metaBullet.classList.remove('hidden');
      } else {
        locationBox.classList.add('hidden');
      }

      document.getElementById('user-bio').textContent = CONFIG.bio;
      
      // অটো-ডিটেক্ট ইমেজ লোডার: কোনো থার্ড-পার্টি ইমেজের ব্যাকআপ তুলে দিয়ে ক্লিন নিউট্রাল আইকন রাখা হয়েছে
      const possibleAvatars = [
        CONFIG.avatarUrl,
        'profile.jpg',
        'profile.png',
        'profile.jpeg',
        '39_26 AM_2.png',
        '39_26 AM.png'
      ];
      let avatarIndex = 0;

      const avatarEl = document.getElementById('profile-avatar');
      const defaultSvgFallback = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' fill='%238C8475' viewBox='0 0 24 24'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>";

      avatarEl.onerror = function() {
        avatarIndex++;
        if (avatarIndex < possibleAvatars.length) {
          this.src = possibleAvatars[avatarIndex];
        } else {
          this.src = defaultSvgFallback;
        }
      };
      avatarEl.src = possibleAvatars[0];

      document.getElementById('cover-img').src = CONFIG.coverUrl;

      document.getElementById('btn-call').href = `tel:${CONFIG.phone}`;
      document.getElementById('btn-whatsapp').href = `https://wa.me/${CONFIG.whatsapp}`;
      document.getElementById('btn-email').href = `mailto:${CONFIG.email}`;

      const linksContainer = document.getElementById('links-container');
      linksContainer.innerHTML = '';

      CONFIG.links.forEach(link => {
        if (!link.url && !link.copyValue) return;

        const card = document.createElement('a');
        card.href = link.url || '#';
        if (link.url && link.url.startsWith('http')) {
          card.target = "_blank";
          card.rel = "noopener noreferrer";
        }
        
        if (link.action === "copy") {
          card.onclick = (e) => {
            e.preventDefault();
            fallbackCopyText(link.copyValue);
            showToast(`${link.title} tag copied!`);
          };
        }

        card.className = "link-row";
        card.innerHTML = `
          <span class="ico">${link.icon}</span>
          <span class="txt"><b>${link.title}</b><small>${link.subtitle}</small></span>
          <svg class="chev" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 5l7 7-7 7"/></svg>
        `;
        
        linksContainer.appendChild(card);
      });

      const qrcodeContainer = document.getElementById("qrcode-canvas");
      qrcodeContainer.innerHTML = '';
      if (window.QRCode) {
        new QRCode(qrcodeContainer, {
          text: window.location.href,
          width: 150,
          height: 150,
          colorDark: "#1C1A17",
          colorLight: "#FFFFFF",
          correctLevel: QRCode.CorrectLevel.H
        });
      }
    });

    function downloadVCard() {
      const vcardData = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        `FN;CHARSET=UTF-8:${CONFIG.fullName}`,
        `N;CHARSET=UTF-8:${CONFIG.fullName.split(' ').pop()};${CONFIG.fullName.split(' ')[0]};;;`,
        CONFIG.company ? `ORG;CHARSET=UTF-8:${CONFIG.company}` : '',
        `TITLE;CHARSET=UTF-8:${CONFIG.profession}`,
        `TEL;TYPE=CELL,VOICE:${CONFIG.phone}`,
        `EMAIL;TYPE=WORK,INTERNET:${CONFIG.email}`,
        `NOTE;CHARSET=UTF-8:${CONFIG.vcard.note}`,
        'END:VCARD'
      ].filter(Boolean).join('\n');

      const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8;' });
      const url = window.URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.setAttribute('download', `${CONFIG.fullName.replace(/\s+/g, '_')}.vcf`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      window.URL.revokeObjectURL(url);

      showToast("Contact card downloaded");
    }

    function copyProfileUrl() {
      const currentUrl = window.location.href;
      
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(currentUrl).then(() => {
          showToast("Profile URL copied");
        }).catch(() => {
          fallbackCopyText(currentUrl);
        });
      } else {
        fallbackCopyText(currentUrl);
      }
    }

    function fallbackCopyText(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      
      try {
        document.execCommand('copy');
        showToast("Profile URL copied");
      } catch (err) {
        showToast("Unable to copy URL");
      }
      document.body.removeChild(textarea);
    }

    function nativeShare() {
      if (navigator.share) {
        navigator.share({
          title: `${CONFIG.fullName} | Digital Profile`,
          text: `Contact profile for ${CONFIG.fullName}`,
          url: window.location.href
        }).catch(() => {});
      } else {
        copyProfileUrl();
      }
    }

    function openQrModal() {
      const modal = document.getElementById('qr-modal');
      const content = document.getElementById('qr-modal-content');
      modal.classList.remove('pointer-events-none', 'opacity-0');
      modal.classList.add('opacity-100');
      content.classList.remove('scale-95');
      content.classList.add('scale-100');
    }

    function closeQrModal() {
      const modal = document.getElementById('qr-modal');
      const content = document.getElementById('qr-modal-content');
      modal.classList.add('pointer-events-none', 'opacity-0');
      modal.classList.remove('opacity-100');
      content.classList.add('scale-95');
      content.classList.remove('scale-100');
    }

    function openShareModal() {
      const modal = document.getElementById('share-modal');
      const content = document.getElementById('share-modal-content');
      modal.classList.remove('pointer-events-none', 'opacity-0');
      modal.classList.add('opacity-100');
      content.classList.remove('translate-y-full');
      content.classList.add('translate-y-0');
    }

    function closeShareModal() {
      const modal = document.getElementById('share-modal');
      const content = document.getElementById('share-modal-content');
      modal.classList.add('pointer-events-none', 'opacity-0');
      modal.classList.remove('opacity-100');
      content.classList.add('translate-y-full');
      content.classList.remove('translate-y-0');
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-message');
      toastMsg.textContent = message;
      
      toast.classList.remove('-translate-y-20', 'opacity-0', 'pointer-events-none');
      toast.classList.add('translate-y-0', 'opacity-100');
      
      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('-translate-y-20', 'opacity-0', 'pointer-events-none');
      }, 2600);
    }
  </script>
