<style>
:root{
  --bg:#040404;
  --bone:#ECE7DC;
  --soft:#BEB8AC;
  --mute:#8B867B;
  --dim:#5A564E;
  --edge:rgba(236,231,220,.11);
  --panel:rgba(236,231,220,.035);
  --e:cubic-bezier(.22,1,.36,1);
  --col:min(100vw,480px);
  --serif:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color-scheme:dark}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--bone);font:15px/1.65 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-text-size-adjust:100%}
a,button{font:inherit;color:inherit;text-decoration:none;touch-action:manipulation}
button{cursor:pointer;border:0;background:none;padding:0}
a:focus-visible,button:focus-visible{outline:2px solid var(--bone);outline-offset:3px;border-radius:6px}
svg{display:block}

#page{max-width:480px;margin:0 auto}

/* fixed top bar */
.bar{position:fixed;top:0;left:0;right:0;z-index:20;pointer-events:none}
.bar-in{max-width:480px;margin:0 auto;display:flex;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0}
.pill{pointer-events:auto;height:42px;min-width:42px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;
  background:rgba(12,12,11,.78);border:1px solid var(--edge);font-size:13px;font-weight:500;color:var(--bone);
  transition:background .2s,transform .15s var(--e)}
.pill svg{width:18px;height:18px}
.pill:active{transform:scale(.95);background:rgba(236,231,220,.14)}

/* hero */
.hero{position:relative;height:calc(var(--col)*1.19 + 236px);overflow:hidden}
.photo{position:absolute;top:0;left:-16%;width:120%}
.photo img{display:block;width:100%;height:auto;aspect-ratio:1000/1240;object-fit:cover}
.hero::before,.hero::after{content:"";position:absolute;z-index:1;pointer-events:none}
.hero::before{top:0;right:0;bottom:0;width:12%;background:linear-gradient(to left,var(--bg),transparent)}
.hero::after{left:0;right:0;bottom:0;height:46%;background:linear-gradient(to top,var(--bg) 6%,transparent)}
/* parallax runs on the compositor (no JS scroll handler) where supported */
@supports (animation-timeline:scroll()){
  .photo{animation:par linear both;animation-timeline:scroll(root);animation-range:0 550px}
  @keyframes par{to{transform:translate3d(0,200px,0);opacity:.12}}
}
.id{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:0 24px 28px}
.name{margin:0;font:400 clamp(46px,calc(var(--col)*.135),64px)/.96 var(--serif);letter-spacing:-.02em;color:var(--bone)}
.role{margin:16px 0 0;font-size:15px;font-weight:500;color:var(--soft);letter-spacing:.01em}
.loc{margin:6px 0 0;display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--mute)}
.loc svg{width:14px;height:14px}

/* the one orchestrated moment: the portrait is lit from darkness */
html.js .photo img{opacity:0;transform:scale(1.04)}
html.js .id>*{opacity:0;transform:translateY(10px)}
html.js.lit .photo img{opacity:1;transform:none;transition:opacity 1.4s var(--e),transform 2s var(--e)}
html.js.lit .id>*{opacity:1;transform:none;transition:opacity 1s var(--e),transform 1.1s var(--e)}
html.js.lit .id>:nth-child(1){transition-delay:.7s}
html.js.lit .id>:nth-child(2){transition-delay:.85s}
html.js.lit .id>:nth-child(3){transition-delay:1s}

/* ===== aesthetic layer (transform/opacity only, cheap on phones) ===== */
.hero{background:radial-gradient(110% 55% at 50% 0%,rgba(236,231,220,.075),transparent 62%)}
.status{margin:12px 0 0;display:inline-flex;align-items:center;gap:9px;padding:6px 12px 6px 11px;border-radius:999px;background:rgba(236,231,220,.05);border:1px solid var(--edge);font-size:12px;font-weight:500;letter-spacing:.02em;color:var(--soft)}
.status i{position:relative;width:7px;height:7px;border-radius:50%;background:#8FE3A2}
.status i::after{content:"";position:absolute;inset:0;border-radius:50%;background:#8FE3A2;animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{transform:scale(1);opacity:.6}80%,100%{transform:scale(3.2);opacity:0}}
.status em{font-style:normal;color:var(--dim)}
.eyebrow{margin:26px 2px 0;font-size:10.5px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:12px}
.eyebrow::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--edge),transparent)}
.eyebrow+.tabs{margin-top:14px}
.eyebrow.e2{margin-top:46px}
.eyebrow.e2+h2{margin-top:14px}
.row::after{content:"";flex:none;width:7px;height:7px;margin-left:-4px;border-top:1.5px solid var(--dim);border-right:1.5px solid var(--dim);transform:rotate(45deg)}
.rv{opacity:1}
html.js .rv{opacity:0;transform:translateY(18px)}
html.js .rv.in{opacity:1;transform:none;transition:opacity .9s var(--e),transform 1s var(--e)}
.cta::after{left:0;transform:translateX(-170%) skewX(-20deg);transition:none;animation:shine 5.5s var(--e) 2.8s infinite}
@keyframes shine{0%,55%{transform:translateX(-170%) skewX(-20deg)}100%{transform:translateX(480%) skewX(-20deg)}}
html.js.lit .id>:nth-child(4){transition-delay:1.15s}

/* ===== premium layer ===== */
html{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0}
.prog{display:none}
@supports (animation-timeline:scroll()){
  .prog{display:block;position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:2px;z-index:25;pointer-events:none;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,transparent,#F2EDE1);animation:prog linear both;animation-timeline:scroll(root)}
  @keyframes prog{to{transform:scaleX(1)}}
}
.name{background:linear-gradient(180deg,#FBF8F0 15%,#A9A395 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.sig{margin:10px 0 0;text-align:center;font-size:10px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--dim);opacity:.7}
.foot{cursor:pointer}
.hint{margin:10px 2px 0;font-size:11px;color:var(--dim);letter-spacing:.04em}

/* body */
.body{padding:8px 22px calc(env(safe-area-inset-bottom,0px) + 40px)}
.tabs{position:relative;display:flex;gap:28px;border-bottom:1px solid var(--edge)}
.tabs button{padding:6px 0 14px;font:400 24px/1 var(--serif);letter-spacing:-.01em;color:var(--dim);transition:color .35s}
.tabs button[aria-selected=true]{color:var(--bone)}
.ind{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:linear-gradient(90deg,#7C766A,#F2EDE1,#7C766A);transition:transform .6s var(--e),width .6s var(--e)}
.desc{margin:20px 0 0;min-height:8.6em;color:var(--soft);font-size:15.5px;line-height:1.7}
.desc.sw{animation:sw .45s var(--e)}
@keyframes sw{from{opacity:0;transform:translate3d(var(--dx,0px),0,0)}}

.cta{position:relative;overflow:hidden;margin-top:18px;width:100%;height:56px;display:flex;align-items:center;justify-content:center;gap:10px;border-radius:14px;color:#14120E;font-weight:600;font-size:15px;letter-spacing:.01em;
  background:linear-gradient(180deg,#F4F0E6 0%,#D6D0C3 47%,#B3AC9D 53%,#DCD6C9 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -1px 0 rgba(0,0,0,.25),0 18px 30px -16px rgba(0,0,0,.9);transition:transform .15s var(--e)}
.cta svg{width:20px;height:20px}
.cta::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transition:left .8s var(--e)}
.cta:active{transform:scale(.985)}

.panel{border-radius:20px;background:var(--panel);border:1px solid var(--edge);box-shadow:inset 0 1px 0 rgba(236,231,220,.07);overflow:hidden}
.quick{margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr)}
.quick a{display:flex;flex-direction:column;align-items:center;gap:8px;padding:17px 4px 15px;font-size:12.5px;font-weight:500;color:var(--soft);transition:background .2s}
.quick a+a{border-left:1px solid var(--edge)}
.quick svg{width:22px;height:22px;color:var(--bone)}
.quick a:active{background:rgba(236,231,220,.08)}

h2{margin:44px 2px 14px;font:400 30px/1.1 var(--serif);letter-spacing:-.01em}
.row{display:flex;align-items:center;gap:16px;min-height:64px;padding:12px 18px;transition:background .2s}
.row+.row{border-top:1px solid var(--edge)}
.row:active{background:rgba(236,231,220,.08)}
.row svg{width:22px;height:22px;flex:none;color:var(--bone)}
.row b{flex:none;font-size:15px;font-weight:600}
.row small{flex:1;min-width:0;text-align:right;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.foot{margin:52px 0 0;text-align:center;font:italic 400 19px var(--serif);color:var(--dim)}

/* overlays */
.ov{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:18px;background:rgba(0,0,0,.82);opacity:0;pointer-events:none;transition:opacity .3s}
.ov.open{opacity:1;pointer-events:auto}
.mod{width:100%;max-width:320px;padding:26px 24px 20px;border-radius:26px;background:#0E0E0D;border:1px solid var(--edge);box-shadow:inset 0 1px 0 rgba(236,231,220,.07);text-align:center;transform:translateY(14px);transition:transform .4s var(--e)}
.ov.open .mod{transform:none}
.mod h3{margin:0;font:400 28px/1.1 var(--serif)}
.mod p{margin:6px 0 18px;font-size:13px;color:var(--mute)}
#qr{position:relative;width:216px;height:216px;margin:0 auto 12px;border-radius:22px;overflow:hidden;background:#F2EEE3;box-shadow:0 0 0 1px var(--edge),0 24px 40px -22px rgba(0,0,0,.9)}
#qr canvas{display:block;width:100%;height:100%}
.ov.open #qr canvas{animation:qin .6s var(--e) both}
@keyframes qin{from{opacity:0;transform:scale(.94)}}
.qrfail{display:grid;place-items:center;height:100%;padding:18px;color:#3a3830;font-size:12.5px;line-height:1.5}
#qrurl{margin:0 0 14px;font-size:11.5px;letter-spacing:.04em;color:var(--dim);word-break:break-all}
.mod .opt{width:100%;margin-bottom:8px;padding:14px;border-radius:14px;background:var(--panel);border:1px solid var(--edge);font-weight:500;font-size:14px}
.mod .x{width:100%;padding:12px;color:var(--mute);font-weight:500}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);z-index:70;transform:translate(-50%,-90px);padding:11px 18px;border-radius:999px;background:var(--bone);color:#0A0A09;font-size:13px;font-weight:600;transition:transform .45s var(--e);pointer-events:none;white-space:nowrap}
#toast.show{transform:translate(-50%,0)}

@media (max-width:340px){.body{padding-left:18px;padding-right:18px}.tabs{gap:20px}.tabs button{font-size:21px}}
@media (prefers-reduced-motion:reduce){
  html.js .photo img,html.js .id>*{opacity:1;transform:none}
  *{transition-duration:.01ms!important;animation-duration:.01ms!important}
  .prog{animation:none}
  .cta::after,.status i::after{animation:none}
  html.js .rv{opacity:1;transform:none}
}
</style>
</head>

const $ = id => document.getElementById(id);
let tt;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2000)}
function copyText(v,msg){
  const done=()=>toast(msg||'Copied');
  const fb=()=>{const a=document.createElement('textarea');a.value=v;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();done()};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(v).then(done,fb)}else fb();
}
const html=document.documentElement;
const openM=id=>{if(id==='qm')buildQR();$(id).classList.add('open');html.classList.add('ovo');html.style.overflow='hidden'};
const closeM=id=>{$(id).classList.remove('open');html.classList.remove('ovo');html.style.overflow=''};
function nativeShare(){navigator.share?navigator.share({title:CONFIG.fullName+' | Digital Profile',url:location.href}).catch(()=>{}):copyText(location.href,'Link copied')}

document.addEventListener('DOMContentLoaded',()=>{
  document.title=CONFIG.fullName;

  // identity
  const parts=CONFIG.fullName.split(' ');
  $('name').innerHTML=parts[0]+(parts.length>1?'<br>'+parts.slice(1).join(' '):'');
  $('role').textContent=CONFIG.headline;
  $('loc').innerHTML=CONFIG.location?'<svg fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg><span></span>':'';
  if(CONFIG.location)$('loc').lastChild.textContent=CONFIG.location;
  $('foot').textContent=CONFIG.fullName;

  // portrait: try the file first, fall back to the embedded copy
  const list=[CONFIG.avatar,'profile.jpg','profile.jpeg','profile.png',EMBED].filter((v,i,a)=>v&&a.indexOf(v)===i);
  let n=0;const img=$('avatar');
  const lit=()=>html.classList.add('lit');
  img.onload=()=>requestAnimationFrame(lit);
  img.onerror=()=>{n++;if(n<list.length)img.src=list[n]};
  img.src=list[0];
  setTimeout(lit,2500);

  // role tabs
  const tabs=$('tabs'),desc=$('desc'),ind=$('ind');
  const btns=CONFIG.roles.map((r,i)=>{
    const b=document.createElement('button');b.role='tab';b.textContent=r.label;
    b.onclick=()=>select(i,true);tabs.insertBefore(b,ind);return b;
  });
  function moveInd(i){const b=btns[i];ind.style.width=b.offsetWidth+'px';ind.style.transform='translateX('+b.offsetLeft+'px)'}
  function select(i,anim){
    desc.style.setProperty('--dx',(i>=cur_i?1:-1)*16+'px');
    btns.forEach((x,j)=>x.setAttribute('aria-selected',j===i));
    desc.textContent=CONFIG.roles[i].text;
    if(anim){desc.classList.remove('sw');void desc.offsetWidth;desc.classList.add('sw')}
    moveInd(i);cur_i=i;
  }
  let cur_i=0;select(0,false);
  window.addEventListener('resize',()=>moveInd(cur_i));
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>moveInd(cur_i));

  // quick actions
  const empty=(el,l)=>el.onclick=e=>{e.preventDefault();toast(l+' not added yet')};
  CONFIG.phone?$('b-call').href='tel:'+CONFIG.phone:empty($('b-call'),'Number');
  if(CONFIG.whatsapp){$('b-wa').href='https://wa.me/'+CONFIG.whatsapp;$('b-wa').target='_blank';$('b-wa').rel='noopener'}else empty($('b-wa'),'WhatsApp');
  CONFIG.email?$('b-mail').href='mailto:'+CONFIG.email:empty($('b-mail'),'Email');

  // links
  CONFIG.links.forEach(l=>{
    const a=document.createElement('a');a.className='row';a.href=l.url||'#';
    if(/^https?:/.test(l.url||'')){a.target='_blank';a.rel='noopener noreferrer'}
    if(!l.url)a.onclick=e=>{e.preventDefault();l.copy?copyText(l.copy,l.title+' copied'):toast(l.title+' not added yet')};
    a.innerHTML=`${I[l.id]||''}<b>${l.title}</b><small>${l.handle||''}</small>`;
    $('links').appendChild(a);
  });


  // status pill + live local time
  const st=$('status');
  if(CONFIG.status){
    const tick=()=>{let t='';try{t=new Intl.DateTimeFormat('en-US',{hour:'numeric',minute:'2-digit',timeZone:CONFIG.timezone}).format(new Date())}catch(e){}
      $('stxt').innerHTML=CONFIG.status+(t?' <em>&middot;</em> '+t:'')};
    tick();setInterval(tick,30000);
  }else st.remove();

  // reveal on scroll (once)
  const rv=[...document.querySelectorAll('.rv')];
  if('IntersectionObserver' in window){
    const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12,rootMargin:'0px 0px -6% 0px'});
    rv.forEach((el,i)=>{el.style.transitionDelay=(i<3?i*.08:0)+'s';io.observe(el)});
  }else rv.forEach(el=>el.classList.add('in'));
  setTimeout(()=>rv.forEach(el=>el.classList.add('in')),4000);


  // swipe left/right on the About block to change tab
  const ab=tabs.parentElement;let sx=0,sy=0;
  ab.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY},{passive:true});
  ab.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy)*1.6){const n=cur_i+(dx<0?1:-1);if(n>=0&&n<btns.length){select(n,true);navigator.vibrate&&navigator.vibrate(6)}}},{passive:true});

  // signature + tap name to go back to top
  $('sig').textContent='Crafted in '+(CONFIG.location||'Earth')+' \u00B7 '+new Date().getFullYear();
  $('foot').onclick=()=>scrollTo({top:0,behavior:'smooth'});


  // tiny haptic tick on taps (Android)
  document.addEventListener('click',e=>{if(e.target.closest('a,button')&&navigator.vibrate)navigator.vibrate(6)},{passive:true});


});


/* ---------- QR: styled, auto-follows whatever domain the page runs on ---------- */
let qrFor='';
function buildQR(){
  const url=(CONFIG.qrUrl||location.href.split('#')[0]);
  const box=$('qr'),label=$('qrurl');
  label.textContent=location.protocol==='file:'?'Preview only. QR will use your live domain once deployed.':url.replace(/^https?:\/\//,'').replace(/\/$/,'');
  if(url===qrFor&&box.firstChild)return;
  if(!window.QRCode){
    box.innerHTML='<div class="qrfail">Loading QR...</div>';
    if(!buildQR.l){buildQR.l=1;const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js';
      sc.onload=()=>{qrFor='';buildQR()};sc.onerror=()=>{box.innerHTML='<div class="qrfail">QR could not load. Use Share &gt; Copy link.</div>'};document.head.appendChild(sc)}
    return;
  }
  let m;
  try{const t=document.createElement('div');m=new QRCode(t,{text:url,width:8,height:8,correctLevel:QRCode.CorrectLevel.H})._oQRCode}catch(e){m=null}
  if(!m){box.innerHTML='<div class="qrfail">Link too long for QR.</div>';return}
  const N=m.getModuleCount(),Q=4,T=N+Q*2,S=216,dpr=Math.min(3,window.devicePixelRatio||2);
  const cv=document.createElement('canvas');cv.width=cv.height=Math.round(S*dpr);
  const c=cv.getContext('2d'),u=cv.width/T,INK='#0B0B0A',BG='#F2EEE3';
  c.fillStyle=BG;c.fillRect(0,0,cv.width,cv.height);
  const rr=(x,y,w,h,r)=>{x*=u;y*=u;w*=u;h*=u;r*=u;c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()};
  const inFinder=(r,k)=>(r<7&&k<7)||(r<7&&k>=N-7)||(r>=N-7&&k<7);
  const mid=(N-1)/2,R=Math.max(3,Math.round(N*.115));
  c.fillStyle=INK;
  for(let r=0;r<N;r++)for(let k=0;k<N;k++){
    if(!m.isDark(r,k)||inFinder(r,k))continue;
    if(Math.hypot(r-mid,k-mid)<R+1.2)continue;
    c.beginPath();c.arc((k+Q+.5)*u,(r+Q+.5)*u,u*.47,0,6.2832);c.fill();
  }
  [[0,0],[N-7,0],[0,N-7]].forEach(([r,k])=>{
    const x=k+Q,y=r+Q;
    c.fillStyle=INK;rr(x,y,7,7,2.3);c.fill();
    c.fillStyle=BG;rr(x+1,y+1,5,5,1.5);c.fill();
    c.fillStyle=INK;rr(x+2,y+2,3,3,1);c.fill();
  });
  // centre badge with initials
  const cx=(mid+Q+.5)*u,rad=R*u*.95;
  c.fillStyle=BG;c.beginPath();c.arc(cx,cx,rad+u*.7,0,6.2832);c.fill();
  c.fillStyle=INK;c.beginPath();c.arc(cx,cx,rad,0,6.2832);c.fill();
  const ini=CONFIG.fullName.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
  c.fillStyle=BG;c.textAlign='center';c.textBaseline='middle';
  c.font='400 '+(rad*.95)+'px "Bodoni Moda",Didot,Georgia,serif';c.fillText(ini,cx,cx+rad*.06);
  box.innerHTML='';box.appendChild(cv);qrFor=url;
}

function saveVCard(){
  const p=CONFIG.fullName.split(' '),urls=CONFIG.links.filter(l=>/^https?:/.test(l.url||'')).map(l=>'URL:'+l.url);
  const v=['BEGIN:VCARD','VERSION:3.0',`FN:${CONFIG.fullName}`,`N:${p.slice(1).join(' ')};${p[0]};;;`,`TITLE:${CONFIG.headline}`,
    CONFIG.phone&&`TEL;TYPE=CELL:${CONFIG.phone}`,CONFIG.email&&`EMAIL:${CONFIG.email}`,...urls,'NOTE:Met via Digital Profile','END:VCARD'].filter(Boolean).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([v],{type:'text/vcard'}));a.download=CONFIG.fullName.replace(/\s+/g,'_')+'.vcf';
  document.body.appendChild(a);a.click();a.remove();toast('Contact saved');
}
